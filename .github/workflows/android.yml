name: Android APK

on:
  push:
    branches: [main, feat/android-copiloto]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar cmdline-tools si faltan
        run: |
          set -e
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager ya disponible"
            exit 0
          fi
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compilar APK release
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/didi-copiloto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: didi-copiloto
          path: android/dist/didi-copiloto.apk
          if-no-files-found: error

      - name: Publicar release si es tag android-v*
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/didi-copiloto.apk
          name: DIDI Copiloto ${{ github.ref_name }}
          body: |
            APK de DIDI Copiloto para instalar por sideload.

            1. Descarga `didi-copiloto.apk`.
            2. Permite instalar desde esta fuente.
            3. Abre la app y activa la accesibilidad.
            4. En Android 13+: Ajustes → Apps → DIDI Copiloto → ⋮ → Permitir ajustes restringidos.

            La app solo aconseja: no acepta ni rechaza viajes.
